<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>پیگیری سفارش | سروش ایمنی شهر</title><style>:root{--r:#c4161c;--ink:#111827;--mut:#667085;--line:#e5e7eb;--soft:#f8fafc;--green:#067647}*{box-sizing:border-box}body{margin:0;background:var(--soft);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{width:min(680px,calc(100% - 24px));margin:28px auto}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}h1{font-size:23px;margin:0 0 6px}p{color:var(--mut);font-size:12px;line-height:1.8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:11px;font-weight:700;display:grid;gap:6px}input{border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}button{border:0;background:var(--r);color:#fff;border-radius:11px;padding:12px;font-weight:700;font:inherit;cursor:pointer}.full{grid-column:1/-1}.notice{padding:12px;border-radius:11px;background:#fff1f3;color:#b42318;font-size:11px;line-height:1.8}.ok{background:#ecfdf3;color:var(--green)}.status{font-size:18px;font-weight:800;color:var(--r);margin:4px 0 10px}.items{display:grid;gap:6px}.item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:7px 0;font-size:11px}.timeline{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;font-size:10px;color:#475467}.timeline div{margin:5px 0}.payment{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.payment-title{font-size:12px;font-weight:800;margin-bottom:8px}.pay-btn{width:100%;margin-top:9px}.pay-muted{font-size:10px;color:#667085;line-height:1.8}.pay-ref{font-weight:800;color:#067647}a{color:var(--r);text-decoration:none}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><section class="card"><h1>پیگیری سفارش</h1><p>کد پیگیری و همان شماره موبایلی که هنگام ثبت درخواست وارد کرده‌اید را بنویسید.</p><form id="form" class="grid"><label>کد پیگیری<input id="code" required placeholder="SE-261001-XXXXX" autocomplete="off"></label><label>شماره موبایل<input id="phone" required inputmode="tel" placeholder="09xxxxxxxxx" autocomplete="tel"></label><button class="full">نمایش وضعیت سفارش</button></form><div id="msg" style="margin-top:12px"></div></section><section class="card" id="result" hidden></section><div style="text-align:center;font-size:11px"><a href="/">بازگشت به فروشگاه</a></div></main><script>const labels={new:'جدید',contacted:'تماس گرفته شد',quoted:'قیمت اعلام شد',confirmed:'تأیید شد',ready_to_ship:'آماده ارسال',shipped:'ارسال شد',closed:'بسته شد',cancelled:'لغو شد'},payLabels={not_ready:'در انتظار تأیید فروشگاه',ready:'آماده پرداخت',requested:'لینک پرداخت ایجاد شده',paid:'پرداخت شده',failed:'پرداخت ناموفق'};const fa=n=>new Intl.NumberFormat('fa-IR').format(n??0),money=n=>fa(n)+' تومان',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lastLookup=null;async function config(){try{const r=await fetch('/api/payment/config',{cache:'no-store'});return r.ok?await r.json():{enabled:false}}catch{return{enabled:false}}}function paymentHtml(d,cfg){const p=d.payment||{},status=p.status||'not_ready',amount=Number.isInteger(p.gateway_amount_toman)?p.gateway_amount_toman:p.amount_toman;if(status==='paid')return `<div class="payment"><div class="payment-title">وضعیت پرداخت</div><div class="notice ok">پرداخت با موفقیت تأیید شده است.${Number.isInteger(amount)?' مبلغ: '+money(amount):''}${p.reference?`<br>شناسه پرداخت: <span class="pay-ref">${esc(p.reference)}</span>`:''}</div></div>`;if((status==='ready'||status==='requested')&&cfg.enabled)return `<div class="payment"><div class="payment-title">پرداخت سفارش</div><div class="pay-muted">${Number.isInteger(amount)?'مبلغ قابل پرداخت: '+money(amount):'مبلغ نهایی سفارش آماده پرداخت است.'}</div><button type="button" class="pay-btn" id="payNow">${status==='requested'?'ادامه پرداخت':'پرداخت با واریزا'}</button></div>`;if(status==='ready'||status==='requested')return `<div class="payment"><div class="payment-title">وضعیت پرداخت</div><div class="notice">مبلغ سفارش آماده شده است؛ اتصال پرداخت خودکار فروشگاه در حال تکمیل تنظیمات است.</div></div>`;return `<div class="payment"><div class="payment-title">وضعیت پرداخت</div><div class="pay-muted">${esc(payLabels[status]||status)} — پس از تأیید نهایی فروشگاه، امکان پرداخت فعال می‌شود.</div></div>`}async function startPayment(){if(!lastLookup)return;const b=document.getElementById('payNow');if(b){b.disabled=true;b.textContent='در حال ساخت لینک پرداخت...'}try{const r=await fetch('/api/payments/create',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({order_code:lastLookup.code,phone:lastLookup.phone})}),d=await r.json();if(!r.ok)throw new Error(d.error||'ساخت لینک پرداخت انجام نشد');if(!/^https:\/\/variza\.ir\/pay\//i.test(d.payment_url||''))throw new Error('آدرس پرداخت معتبر نیست');location.assign(d.payment_url)}catch(err){document.getElementById('msg').innerHTML='<div class="notice">'+esc(err.message)+'</div>';if(b){b.disabled=false;b.textContent='پرداخت با واریزا'}}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg'),box=document.getElementById('result'),code=document.getElementById('code').value.trim(),phone=document.getElementById('phone').value.trim();msg.innerHTML='';box.hidden=true;try{const q=new URLSearchParams({code,phone});const [r,cfg]=await Promise.all([fetch('/api/order-status?'+q,{cache:'no-store'}),config()]),d=await r.json();if(!r.ok)throw new Error(d.error||'خطا در پیگیری');lastLookup={code,phone};box.innerHTML=`<div class="status">${esc(labels[d.status]||d.status)}</div><div style="font-size:11px;color:#667085">کد پیگیری: <strong>${esc(d.order_code)}</strong></div><div class="items">${d.items.map(i=>`<div class="item"><span>${esc(i.product_name)} × ${fa(i.quantity)}</span><span>${Number.isInteger(i.unit_price_toman)?money(i.unit_price_toman*i.quantity):'استعلام قیمت'}</span></div>`).join('')}</div><div style="margin-top:10px;font-weight:700">${Number.isInteger(d.total_toman)?'جمع: '+money(d.total_toman):'مبلغ نهایی پس از استعلام'}</div>${paymentHtml(d,cfg)}<div class="timeline"><strong>تاریخچه</strong>${(d.history||[]).map(h=>`<div>${esc(labels[h.to_status]||h.to_status)} — ${new Date(h.changed_at).toLocaleString('fa-IR')}</div>`).join('')}</div>`;box.hidden=false;const pay=document.getElementById('payNow');if(pay)pay.onclick=startPayment}catch(err){msg.innerHTML='<div class="notice">'+esc(err.message)+'</div>'}};const initial=new URLSearchParams(location.search).get('code');if(initial)document.getElementById('code').value=initial;</script></body></html>
