<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>حساب کاربری | سروش ایمنی شهر</title><style>:root{--r:#b31319;--ink:#111827;--mut:#667085;--line:#e5e7eb;--soft:#f8fafc;--ok:#067647}*{box-sizing:border-box}body{margin:0;background:var(--soft);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{width:min(760px,calc(100% - 24px));margin:26px auto}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}h1,h2{margin:0 0 8px}p{color:var(--mut);font-size:11px;line-height:1.9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:6px;font-size:11px;font-weight:800}input{border:1px solid var(--line);border-radius:11px;padding:12px;font:inherit}button,.btn{border:0;background:var(--r);color:#fff;border-radius:11px;padding:12px;font:inherit;font-weight:900;cursor:pointer;text-decoration:none;text-align:center}.gray{background:#344054}.full{grid-column:1/-1}.notice{padding:11px;border-radius:10px;background:#fff1f3;color:#b42318;font-size:11px;line-height:1.8}.ok{background:#ecfdf3;color:var(--ok)}.orders{display:grid;gap:10px}.order{border:1px solid var(--line);border-radius:14px;padding:13px}.order-head{display:flex;justify-content:space-between;gap:10px;font-size:12px}.meta{font-size:10px;color:var(--mut);line-height:1.9;margin-top:6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions a{font-size:10px;padding:8px 10px}.pref{display:flex;gap:9px;align-items:center;font-size:11px}.pref input{width:auto}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none!important}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.order-head{flex-direction:column}}</style></head><body><main class="wrap"><section class="card top"><div><h1>حساب کاربری</h1><p>با همان شماره موبایلی که هنگام سفارش وارد کرده‌ای وارد شو؛ سفارش‌های قبلی و جدیدت یکجا نمایش داده می‌شوند.</p></div><a class="btn gray" href="/">بازگشت به فروشگاه</a></section><section class="card" id="loginCard"><h2>ورود با کد پیامکی</h2><div class="grid"><label>شماره موبایل<input id="phone" inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxxx"></label><button id="sendCode">ارسال کد ورود</button><label class="full hidden" id="codeWrap">کد ۶ رقمی<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button class="full hidden" id="verifyCode">ورود به حساب</button></div><div id="loginMsg" style="margin-top:10px"></div><p>اگر ورود پیامکی فروشگاه هنوز فعال نشده، همچنان می‌توانی از <a href="/track/">پیگیری سفارش با کد پیگیری</a> استفاده کنی.</p></section><section class="card hidden" id="accountCard"><div class="top"><div><h2 id="welcome">حساب من</h2><p id="mobile"></p></div><button class="gray" id="logout">خروج</button></div><label class="pref"><input type="checkbox" id="statusSms" checked> پیامک تغییر وضعیت سفارش برایم ارسال شود</label><div id="prefMsg"></div></section><section class="card hidden" id="ordersCard"><h2>سفارش‌های من</h2><div class="orders" id="orders"></div></section></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fa=n=>new Intl.NumberFormat('fa-IR').format(Number(n)||0),money=n=>n==null?'در انتظار تعیین مبلغ':fa(n)+' تومان',labels={new:'جدید',contacted:'تماس گرفته شد',quoted:'قیمت اعلام شد',confirmed:'تأیید شد',ready_to_ship:'آماده ارسال',shipped:'ارسال شد',closed:'بسته شد',cancelled:'لغو شد'};async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt,headers:{'content-type':'application/json',...opt.headers}}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'خطا در ارتباط');return d}function msg(el,text,ok=false){el.innerHTML='<div class="notice '+(ok?'ok':'')+'">'+esc(text)+'</div>'}function logged(on){$('loginCard').classList.toggle('hidden',on);$('accountCard').classList.toggle('hidden',!on);$('ordersCard').classList.toggle('hidden',!on)}async function load(){try{const me=await api('/api/customer/me');logged(true);$('mobile').textContent=me.phone;$('welcome').textContent=me.name?'سلام، '+me.name:'حساب من';$('statusSms').checked=!!me.order_status_sms;const d=await api('/api/customer/orders');$('orders').innerHTML=d.orders.length?d.orders.map(o=>'<article class="order"><div class="order-head"><strong>'+esc(o.order_code)+'</strong><b>'+esc(labels[o.status]||o.status)+'</b></div><div class="meta">تاریخ ثبت: '+new Date(o.created_at).toLocaleString('fa-IR')+'<br>تعداد اقلام: '+fa(o.item_count)+'<br>مبلغ: '+money(o.grand_total_toman)+'</div><div class="actions"><a class="btn gray" href="/track/?code='+encodeURIComponent(o.order_code)+'">جزئیات و پرداخت</a>'+(o.tracking_url?'<a class="btn gray" href="'+esc(o.tracking_url)+'" target="_blank" rel="noopener">رهگیری ارسال</a>':'')+'</div></article>').join(''):'<p>هنوز سفارشی برای این شماره ثبت نشده است.</p>'}catch{logged(false)}}$('sendCode').onclick=async()=>{const b=$('sendCode');b.disabled=true;$('loginMsg').innerHTML='';try{const d=await api('/api/customer/auth/request',{method:'POST',body:JSON.stringify({phone:$('phone').value})});$('codeWrap').classList.remove('hidden');$('verifyCode').classList.remove('hidden');$('code').focus();msg($('loginMsg'),d.test_code?'کد تست: '+d.test_code:'کد ورود ارسال شد.',true)}catch(e){msg($('loginMsg'),e.message)}finally{b.disabled=false}};$('verifyCode').onclick=async()=>{const b=$('verifyCode');b.disabled=true;try{await api('/api/customer/auth/verify',{method:'POST',body:JSON.stringify({phone:$('phone').value,code:$('code').value})});await load()}catch(e){msg($('loginMsg'),e.message)}finally{b.disabled=false}};$('statusSms').onchange=async()=>{try{await api('/api/customer/preferences',{method:'PUT',body:JSON.stringify({order_status_sms:$('statusSms').checked})});msg($('prefMsg'),'تنظیم پیامک ذخیره شد.',true)}catch(e){msg($('prefMsg'),e.message)}};$('logout').onclick=async()=>{await api('/api/customer/logout',{method:'POST',body:'{}'}).catch(()=>{});location.reload()};load();</script></body></html>
